name: Feature request
description: Propose a capability or improvement
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: usecase
    attributes:
      label: Problem / use case
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and alternatives
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and security considerations
