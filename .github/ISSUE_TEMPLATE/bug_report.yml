name: Bug report
description: Report a reproducible (non-security) problem
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: 'Do not post credentials or vulnerabilities. See SECURITY.md for sensitive issues.'
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal safe reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: 'Ubuntu 24.04, Python 3.11, Docker 27, CPU/GPU'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots (optional)
