name: Nebula CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Unit and permission tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile MCP sources
        run: python -m compileall -q mcp
      - name: Install MCP dependencies for client consistency tests
        run: python -m pip install -r mcp/requirements.txt
      - name: Test bounded variable inspector
        run: PYTHONPATH=mcp python -m unittest discover -s mcp -p 'test_variable_probe.py' -v
      - name: Test MCP run retry and stale-output handling
        run: PYTHONPATH=mcp python -m unittest discover -s mcp -p 'test_run_consistency.py' -v
      - name: Verify generated tool reference
        run: python mcp/gen_tool_reference.py --check
